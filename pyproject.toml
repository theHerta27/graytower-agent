[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mihoyo-agent-workbench"
version = "0.1.0"
description = "Local Config and independent Verification game Agent workbench"
requires-python = ">=3.11,<3.13"
dependencies = ["langgraph==1.2.12", "langgraph-checkpoint-sqlite==3.1.1", "pydantic==2.13.5", "langchain-deepseek==1.1.1", "langchain-core==1.6.6", "a2a-sdk[http-server,sqlite]==1.2.1", "mcp==2.3.0", "uvicorn==0.54.0", "httpx==0.28.1"]

[project.scripts]
game-workbench = "agent_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
