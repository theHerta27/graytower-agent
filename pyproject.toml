[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mihoyo-agent-workbench"
version = "0.1.0"
description = "Local Verification experiment slice for the game Agent workbench"
requires-python = ">=3.11,<3.13"
dependencies = ["langgraph==1.2.12", "langgraph-checkpoint-sqlite==3.1.1", "pydantic==2.13.5"]

[tool.setuptools.packages.find]
where = ["src"]
